<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <meta name="description" content="Parthiv Binish — Network Operations and Software Development" />
    <title>Parthiv Binish — Portfolio</title>
    <style>
      html,body{margin:0;min-height:100%;background:#080b10;color:#f2f4f7;font-family:Arial,sans-serif}
      #startup-status{max-width:720px;margin:18vh auto;padding:24px;color:#dce5f2}
      #startup-status h1{font-size:clamp(28px,6vw,42px);font-weight:500}
      #startup-status p{color:#aeb9c8;line-height:1.7}
      #startup-status code{color:#78b2ff;overflow-wrap:anywhere}
    </style>
    <script>
      window.addEventListener('error',function(e){
        var root=document.getElementById('root');
        if(root && (!root.querySelector('main'))){
          root.innerHTML='<section id="startup-status"><h1>Portfolio could not start</h1><p>A browser error stopped the page from loading.</p><p><code>'+String(e.message||'Unknown startup error').replace(/[<>&]/g,'')+'</code></p><p>Please send this screen to the site owner.</p></section>';
        }
      });
      window.addEventListener('unhandledrejection',function(e){
        var root=document.getElementById('root');
        if(root && (!root.querySelector('main'))){
          root.innerHTML='<section id="startup-status"><h1>Portfolio could not start</h1><p>'+String(e.reason&&e.reason.message||e.reason||'An unexpected startup error occurred').replace(/[<>&]/g,'')+'</p><p>Please send this screen to the site owner.</p></section>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"><section id="startup-status"><h1>Loading portfolio…</h1><p>If this message stays here, the app script did not finish loading.</p></section></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
